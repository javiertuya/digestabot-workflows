name: docker-digests

on:
  workflow_call:
    inputs:
      image-name:
        description: Name of the base image, used in the branch, the PR title and the issue title
        type: string
        required: true
      working-dir:
        description: Folder that contains the Dockerfiles
        type: string
        default: dockerfiles
      include-files:
        description: Dockerfile name pattern (basename only, matched inside working-dir)
        type: string
        default: Dockerfile*
      title-prefix:
        description: Prefix of the PR title and commit message, the image name is appended
        type: string
        default: Update Docker image digests for
      stale-days:
        description: The job fails if an image was built more than this number of days ago
        type: number
        default: 30
      dhi-login:
        description: Log in to dhi.io (requires the DHI_USERNAME and DHI_TOKEN secrets)
        type: boolean
        default: false
      assignee:
        description: GitHub user that is assigned and mentioned in the issue opened on failure (none if empty)
        type: string
        default: ''
    secrets:
      DIGESTABOT_TOKEN:
        description: Personal access token (classic or fine-grained) used to push and to open the PR, so that other workflows are triggered
        required: true
      DHI_USERNAME:
        required: false
      DHI_TOKEN:
        required: false

jobs:
  update-digests:
    runs-on: ubuntu-latest
    # Two runs for the same image would push to the same branch
    concurrency: digestabot-${{ inputs.image-name }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - id: checkout
        uses: actions/checkout@v7.0.1
        with:
          # The push done by digestabot reuses the checkout credentials, so the PAT is needed here too
          token: ${{ secrets.DIGESTABOT_TOKEN }}
      - id: dhi-login
        if: inputs.dhi-login
        uses: docker/login-action@v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - id: digestabot
        uses: chainguard-dev/digestabot@v1.3.2
        with:
          token: ${{ secrets.DIGESTABOT_TOKEN }}
          working-dir: ${{ inputs.working-dir }}
          include-files: ${{ inputs.include-files }}
          use-gitsign: 'false'
          # Fixed prefix and label (not inputs) so that other tools can identify these PRs (e.g. dashgit uses the label)
          branch-for-pr: digestabot/docker/${{ inputs.image-name }}
          title-for-pr: ${{ inputs.title-prefix }} ${{ inputs.image-name }}
          commit-message: ${{ inputs.title-prefix }} ${{ inputs.image-name }}
          labels-for-pr: dependencies, docker, digestabot
          description-for-pr: |
            Refreshes the pinned digest of the `${{ inputs.image-name }}` base image in `${{ inputs.working-dir }}`.

            The tag is unchanged: the registry now serves a different image behind it (e.g. a rebuilt base OS). The diff shows the previous and the new digest.

            Generated by [digestabot](https://github.com/chainguard-dev/digestabot).
      - id: setup-crane
        uses: imjasonh/setup-crane@v0.7
      # digestabot only logs the images it cannot resolve (e.g. registry without login) and
      # does not detect stale tags in the released version, so both are checked here with crane
      - id: check
        name: Check that all images can be resolved and are not stale
        env:
          STALE_AFTER_DAYS: ${{ inputs.stale-days }}
          WORKING_DIR: ${{ inputs.working-dir }}
          INCLUDE_FILES: ${{ inputs.include-files }}
        run: |
          errors_file="$RUNNER_TEMP/digestabot-errors.txt"
          failed=0
          fail() {
            echo "::error::$1"
            echo "- $1" >> "$errors_file"
            failed=1
          }
          while read -r ref; do
            image="${ref%%@*}"
            if ! crane digest "$image" > /dev/null 2>&1; then
              fail "Cannot retrieve the digest of $image"
              continue
            fi
            # Build time: manifest annotation, or the config of the amd64 image as a fallback
            created=$(crane manifest "$image" 2>/dev/null | jq -r '.annotations["org.opencontainers.image.created"] // empty')
            [ -n "$created" ] || created=$(crane config --platform linux/amd64 "$image" 2>/dev/null | jq -r '.created // empty')
            if [ -z "$created" ]; then
              echo "::notice::Cannot determine the build date of $image, skipping the stale check"
              continue
            fi
            age=$(( ($(date +%s) - $(date -d "$created" +%s)) / 86400 ))
            if [ "$age" -gt "$STALE_AFTER_DAYS" ]; then
              fail "Stale image $image: last built on ${created%%T*} ($age days ago, limit $STALE_AFTER_DAYS)"
            fi
          done < <(grep -rhoE --include="$INCLUDE_FILES" '[^[:space:]="]+@sha256:[a-f0-9]{64}' "$WORKING_DIR")
          exit $failed
      # Report the failure in an issue (or in a comment if there is already an open one)
      - name: Report failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ inputs.assignee }}
          TITLE: Digestabot workflow failed updating docker image digests for ${{ inputs.image-name }}
          # Step outcomes are read here instead of from the jobs API, which may not have the last failure yet
          OUTCOMES: |
            Checkout: ${{ steps.checkout.outcome }}
            Login to dhi.io: ${{ steps.dhi-login.outcome }}
            Digestabot: ${{ steps.digestabot.outcome }}
            Setup crane: ${{ steps.setup-crane.outcome }}
            Check that all images can be resolved and are not stale: ${{ steps.check.outcome }}
        run: |
          steps=$(sed -n 's/^\(.*\): failure$/- Failed step: \1/p' <<< "$OUTCOMES")
          errors=$(cat "$RUNNER_TEMP/digestabot-errors.txt" 2>/dev/null || true)
          mention=""
          [ -z "$ASSIGNEE" ] || mention="@$ASSIGNEE "
          body="${mention}The digestabot workflow failed: $RUN_URL"$'\n\n'"$steps"$'\n'"$errors"
          # The search is not exact (e.g. 'for node' also finds 'for node-dev'), so the title is compared here
          number=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE))[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            assign=()
            [ -z "$ASSIGNEE" ] || assign=(--assignee "$ASSIGNEE")
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body" "${assign[@]}"
          fi
